name: DevSecOps Pipeline

# Security pipeline for the IDFC FIRST gift card lab.
# Expected result on this repo: findings in EVERY stage — that is the point.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  # ---------------- SAST: Semgrep ----------------
  sast-semgrep:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    container: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4
      - name: Run Semgrep (OWASP ruleset + custom lab rules)
        run: |
          semgrep scan \
            --config p/owasp-top-ten \
            --config p/javascript \
            --config p/react \
            --config devsecops/semgrep-rules.yml \
            --json --output semgrep-report.json \
            backend frontend || true
      - uses: actions/upload-artifact@v4
        with:
          name: semgrep-report
          path: semgrep-report.json

  # ---------------- SCA: npm audit + Trivy ----------------
  sca-dependencies:
    name: SCA (npm audit + Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: npm audit (backend)
        working-directory: backend
        run: npm audit --audit-level=moderate --json > ../audit-backend.json || true

      - name: npm audit (frontend)
        working-directory: frontend
        run: npm audit --audit-level=moderate --json > ../audit-frontend.json || true

      - name: Trivy filesystem scan (dep CVEs + misconfig)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          format: json
          output: trivy-report.json
          exit-code: '0'

      - uses: actions/upload-artifact@v4
        with:
          name: sca-reports
          path: |
            audit-backend.json
            audit-frontend.json
            trivy-report.json

  # ---------------- Secret scanning: Gitleaks ----------------
  secret-scan:
    name: Secrets (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history — secrets hide in old commits
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_CONFIG: devsecops/gitleaks.toml
          GITLEAKS_ENABLE_COMMENTS: 'false'

  # ---------------- DAST: OWASP ZAP baseline ----------------
  dast-zap:
    name: DAST (OWASP ZAP baseline)
    runs-on: ubuntu-latest
    needs: [sast-semgrep]
    steps:
      - uses: actions/checkout@v4

      - name: Build and start the lab
        run: docker compose up -d --build

      - name: Wait for backend
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:5000/api/v1/health && break || sleep 2
          done

      - name: ZAP baseline scan against the API
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: 'http://localhost:5000/api/v1/health'
          rules_file_name: 'devsecops/zap-rules.tsv'
          cmd_options: '-a -j -m 5 -T 15 -z "-config replacer.full_list(0).enabled=false"'
        continue-on-error: true # lab is EXPECTED to fail — keep pipeline green for teaching

      - name: Teardown
        if: always()
        run: docker compose down -v
